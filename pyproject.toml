[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-code-reviewer"
version = "0.1.0"
description = "An autonomous AI agent for GitHub PR review, security analysis, and automated fixing using LangGraph and Docker sandboxing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Rustam Shiriyev", email = "rustam@example.com"} # Kullanıcı hafızasından alınan isim
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-community>=0.2.0",
    "openai>=1.35.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "docker>=7.1.0",
    "bandit>=1.7.0",
    "radon>=6.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "B", "C4"]
ignore = ["E501"] # Let formatter handle line length

[tool.ruff.isort]
known-first-party = ["src"]
